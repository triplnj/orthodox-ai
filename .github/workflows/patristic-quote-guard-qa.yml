name: Universal patristic quotation guard QA
on:
  push:
    branches:
      - feature/patristic-universal-verbatim-quote-guard-20261113
  pull_request:
    paths:
      - 'src/app/api/chat/route.ts'
      - 'src/lib/chat/verbatim-patristic-quote-guard.ts'
      - 'tests/patristic-verbatim-quote-guard.test.mjs'
      - '.github/workflows/patristic-quote-guard-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quote-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: ""
      DIRECT_URL: ""
      OPENAI_API_KEY: ""
      RESEND_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Universal quote verification + existing patristic regressions
        run: node tests/run-regressions.mjs patristic-verbatim-quote-guard patristic-source-cards-clarity bibliography-knowledge-graph fast-patristic-research reviewed-gregory-production phase6-api
      - name: Typecheck
        run: npx tsc --noEmit
