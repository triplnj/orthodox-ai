name: Patristic Library - Six-Question Retrieval Benchmark (Staging Only)

# One-off launch triggered only by adding/editing this exact file.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patristic-retrieval-benchmark-once.yml'

permissions:
  contents: read

jobs:
  compare-three-fathers:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: patristic-library-staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install isolated dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Unit-test staging-only retrieval and attribution policy (zero API calls)
        run: node --test tests/patristic-retrieval-benchmark.test.mjs tests/patristic-library-evaluate.test.mjs tests/patristic-evidence-policy.test.mjs
      - name: Verify Neon staging guard read-only
        env:
          LIBRARY_STAGING_DB_URL: ${{ secrets.LIBRARY_STAGING_DB_URL }}
          LIBRARY_STAGING_BRANCH_ID: ${{ secrets.LIBRARY_STAGING_BRANCH_ID }}
        run: node scripts/patristics/check-staging-connection.mjs
      - name: Benchmark six bilingual questions against all indexed Fathers (read-only)
        env:
          LIBRARY_STAGING_DB_URL: ${{ secrets.LIBRARY_STAGING_DB_URL }}
          LIBRARY_STAGING_BRANCH_ID: ${{ secrets.LIBRARY_STAGING_BRANCH_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: node scripts/patristics/benchmark-retrieval-staging.mjs > "$RUNNER_TEMP/patristic-retrieval-benchmark.json"
      - name: Report author retrieval quality
        shell: bash
        run: |
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const r=JSON.parse(readFileSync(process.env.RUNNER_TEMP+"/patristic-retrieval-benchmark.json","utf8"));
            const summary=[
              "### Patristic retrieval QA — staging only",
              "Six bilingual questions, one embedding batch, read-only Neon queries.",
              "Indexed "+r.indexedPassages+"/"+r.totalPassages+" passages.",
              "Expected-author recall@5: "+r.authorRecallAt5,
              "Missing author-scoped results: "+r.missingScopedResults.join(", "),
              "",
              "| Question | Expected Father | Rank in unfiltered top 5 | Scoped hits |",
              "|---|---|---:|---:|",
              ...r.reports.map(x=>"| "+x.id+" | "+x.expectedAuthor+" | "+(x.authorRankTop5??"Not found")+" | "+x.scopedAuthorResults+" |"),
              "",
              "**This is retrieval diagnostics only, NOT a doctrinal accuracy certification.**"
            ].join("\n");
            console.log(summary);
          ' >> "$GITHUB_STEP_SUMMARY"
      - name: Archive per-question sources, scores and evidence flags
        uses: actions/upload-artifact@v4
        with:
          name: patristic-retrieval-benchmark
          path: ${{ runner.temp }}/patristic-retrieval-benchmark.json
          retention-days: 7
          if-no-files-found: error
