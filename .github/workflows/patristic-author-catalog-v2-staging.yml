name: Patristic Catalog Author V2 - Staging Holdout
on:
  push:
    branches:
      - experiment/patristic-catalog-author-v2-20261109
    paths:
      - '.github/workflows/patristic-author-catalog-v2-staging.yml'
      - 'scripts/patristics/resolve-author-catalog-v2.mjs'
      - 'scripts/patristics/evaluate-author-catalog-v2-staging.mjs'
      - 'tests/fixtures/patristic-author-catalog-v2-holdout.json'
      - 'tests/patristic-resolve-author-catalog-v2.test.mjs'
      - 'tests/patristic-author-catalog-v2-adversarial.test.mjs'
      - 'tests/fixtures/patristic-author-catalog-v2-adversarial.json'
      - 'scripts/patristics/assess-passage-attribution.mjs'
      - 'tests/patristic-passage-attribution-gate.test.mjs'
      - 'scripts/patristics/integrate-evidence-staging.mjs'
      - 'scripts/patristics/rank-staging-source-evidence.mjs'
      - 'tests/patristic-rank-staging-source-evidence.test.mjs'
      - 'tests/fixtures/patristic-chat-staging-integration.json'
      - 'scripts/patristics/audit-staging-transcriptions.mjs'
      - 'tests/patristic-source-text-audit.test.mjs'
      - 'scripts/patristics/finalize-staging-source-review.mjs'
      - 'tests/patristic-finalize-source-review.test.mjs'
      - 'scripts/patristics/resolve-reviewed-logical-author.mjs'
      - 'scripts/patristics/test-gregory-identity-speakers-staging.mjs'
      - 'tests/patristic-reviewed-logical-author.test.mjs'
      - 'tests/patristic-chat-preview-isolation.test.mjs'
      - 'src/lib/preview/chat-isolation.ts'
      - 'src/app/api/chat/route.ts'
      - 'tests/fixtures/patristic-gregory-logical-identity-review.json'
      - 'tests/fixtures/patristic-gregory-speaker-evidence-review.json'
      - 'tests/fixtures/patristic-staging-quarantined-fragments.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-staging-holdout:
    runs-on: ubuntu-latest
    environment: patristic-library-staging
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Independent resolver unit tests
        run: node --test tests/patristic-resolve-author-catalog-v2.test.mjs tests/patristic-author-catalog-v2-adversarial.test.mjs tests/patristic-passage-attribution-gate.test.mjs tests/patristic-rank-staging-source-evidence.test.mjs tests/patristic-source-text-audit.test.mjs tests/patristic-finalize-source-review.test.mjs tests/patristic-reviewed-logical-author.test.mjs tests/patristic-chat-preview-isolation.test.mjs
      - name: Verify protected staging database
        env:
          LIBRARY_STAGING_DB_URL: ${{ secrets.LIBRARY_STAGING_DB_URL }}
          LIBRARY_STAGING_BRANCH_ID: ${{ secrets.LIBRARY_STAGING_BRANCH_ID }}
        run: node scripts/patristics/check-staging-connection.mjs
      - name: Evaluate 18 unseen author-routing questions without writes
        env:
          LIBRARY_STAGING_DB_URL: ${{ secrets.LIBRARY_STAGING_DB_URL }}
          LIBRARY_STAGING_BRANCH_ID: ${{ secrets.LIBRARY_STAGING_BRANCH_ID }}
        run: node scripts/patristics/evaluate-author-catalog-v2-staging.mjs > "$RUNNER_TEMP/patristic-author-catalog-v2-holdout.json"
      - name: Publish measured metrics including unresolved variants
        shell: bash
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import {readFileSync} from 'node:fs';
          const r=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/patristic-author-catalog-v2-holdout.json','utf8'));
          if(r.status!=='CATALOG_AUTHOR_V2_STAGING_HOLDOUT'||r.total!==18||r.adversarialTotal!==19||r.databaseWrites!==0||r.productionChanges!==0||r.embeddingRequests!==0)throw Error('Unexpected staging report');
          const lines=['## Independent author recognition holdout','',
            'Correct routing: '+r.correctCount+'/'+r.total+' ('+(r.accuracy*100).toFixed(1)+'%)',
            'Adversarial regression: '+r.adversarialCorrect+'/'+r.adversarialTotal,
            'Catalogue rows without name variants: '+r.missingVariantRows,
            'Duplicate indexed canonical names: '+r.duplicateCanonicalNames.join(', '),'',
            '| Case | Expected scope | Actual scope | Recognized authors | Correct |',
            '|---|---|---|---|---|'];
          for(const q of r.results)lines.push('| '+q.id+' | '+q.expectedScope+' | '+q.actualScope+' | '+q.authors.join(', ')+' | '+q.correct+' |');
          lines.push('', '### Post-discovery adversarial regressions', '', '| Case | Expected | Actual | Correct |', '|---|---|---|---|');
          for(const q of r.adversarialResults)lines.push('| '+q.id+' | '+q.expectedScope+' | '+q.actualScope+' | '+q.correct+' |');
          lines.push('','This is routing only, not passage attribution or answer correctness. Production untouched.');
          process.stdout.write(lines.join('\n')+'\n');
          NODE
      - name: Read-only question-to-evidence integration (9 cases)
        id: integration
        continue-on-error: true
        env:
          LIBRARY_STAGING_DB_URL: ${{ secrets.LIBRARY_STAGING_DB_URL }}
          LIBRARY_STAGING_BRANCH_ID: ${{ secrets.LIBRARY_STAGING_BRANCH_ID }}
        run: node scripts/patristics/integrate-evidence-staging.mjs > "$RUNNER_TEMP/patristic-chat-staging-integration.json"
      - name: Publish integration findings
        if: always()
        shell: bash
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import {readFileSync,existsSync} from 'node:fs';
          const file=process.env.RUNNER_TEMP+'/patristic-chat-staging-integration.json';
          if(!existsSync(file)){process.stdout.write('### Staging evidence integration unavailable (step error)\\n');process.exit(0);}
          const r=JSON.parse(readFileSync(file,'utf8'));
          if(r.status!=='STAGING_EVIDENCE_INTEGRATION_NO_LLM'||r.total!==9||
             r.databaseWrites!==0||r.aiCalls!==0||r.chatWrites!==0||r.productionChanges!==0)
            throw Error('Unexpected staging integration report');
          const lines=['### Staging question-to-passage integration','',`Verified ${r.passed}/${r.total} (failures remain release blockers)`,'',
            '| Test | Evidence | Pass |','|---|---:|---|'];
          for(const x of r.results)lines.push(`| ${x.id} | ${x.evidenceCount} | ${x.accepted} |`);
          lines.push('','Editorial review pending for '+r.pendingEditorialReview+' retrieved source candidates.',
            'No model-generated answer was produced. All passages are staging/unreviewed unless separately checked.');
          process.stdout.write(lines.join('\\n')+'\\n');
          NODE
      - name: Save integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patristic-chat-staging-integration
          path: ${{ runner.temp }}/patristic-chat-staging-integration.json
          retention-days: 21
          if-no-files-found: warn
      - name: Audit every staged passage against its published source
        id: full_source_audit
        if: always()
        continue-on-error: true
        env:
          LIBRARY_STAGING_DB_URL: ${{ secrets.LIBRARY_STAGING_DB_URL }}
          LIBRARY_STAGING_BRANCH_ID: ${{ secrets.LIBRARY_STAGING_BRANCH_ID }}
        run: node scripts/patristics/audit-staging-transcriptions.mjs > "$RUNNER_TEMP/patristic-source-text-audit.json"
      - name: Publish source audit findings
        if: always()
        shell: bash
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import {readFileSync,existsSync} from 'node:fs';
          const p=process.env.RUNNER_TEMP+'/patristic-source-text-audit.json';
          if(!existsSync(p)){process.stdout.write('### Source audit unavailable — runner failure\\n');process.exit(0);}
          const r=JSON.parse(readFileSync(p,'utf8'));
          const lines=['### Full staging transcription audit','',
            'Passages checked: '+r.total,
            'Source URLs: '+r.sourceUrls,
            'Stored SHA-256 mismatches: '+r.badHashes,
            'Quarantined non-evidence fragments: '+r.quarantinedNonEvidence,
            'Source fetch failures: '+r.sourceFailures.length,'',
            '| Audit classification | Count |','|---|---:|'];
          for(const [k,v] of Object.entries(r.stats))lines.push('| '+k+' | '+v+' |');
          lines.push('','This audit checks source text correspondence only. Editorial and theological review remain separate.');
          process.stdout.write(lines.join('\\n')+'\\n');
          NODE
      - name: Classify staging source review after audit
        if: always()
        shell: bash
        run: |
          if test -s "$RUNNER_TEMP/patristic-source-text-audit.json"; then
            node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import {readFileSync} from 'node:fs';
          const r=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/patristic-source-text-audit.json','utf8'));
          if(r.sourceFailures.length)process.stdout.write('Source provider unavailable; classification withheld; production remains blocked.\\n');
          NODE
            if node -e 'const r=JSON.parse(require("node:fs").readFileSync(process.env.RUNNER_TEMP+"/patristic-source-text-audit.json","utf8"));process.exit(r.sourceFailures.length?1:0)'; then
              node scripts/patristics/finalize-staging-source-review.mjs "$RUNNER_TEMP/patristic-source-text-audit.json" "$RUNNER_TEMP/patristic-source-review-classification.json" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "Source audit report missing. Classification unavailable; production blocked." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save classified source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patristic-staging-source-review-classification
          path: ${{ runner.temp }}/patristic-source-review-classification.json
          retention-days: 21
          if-no-files-found: warn
      - name: Save full source audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patristic-full-source-transcription-audit
          path: ${{ runner.temp }}/patristic-source-text-audit.json
          retention-days: 21
          if-no-files-found: warn
      - name: Summarize staging diagnostics and release readiness
        if: always()
        shell: bash
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import {readFileSync,existsSync} from 'node:fs';
          const temp=process.env.RUNNER_TEMP;
          const read=(path)=>existsSync(temp+'/'+path)?JSON.parse(readFileSync(temp+'/'+path,'utf8')):null;
          const integration=read('patristic-chat-staging-integration.json');
          const sourceAudit=read('patristic-source-text-audit.json');
          const sourceReview=read('patristic-source-review-classification.json');
          const causes=[];
          if(!sourceReview||sourceReview.summary?.status!=='STAGING_SOURCE_MATCH_CLASSIFIED'||sourceReview.summary.fullTextMatch!==224||sourceReview.summary.quarantined!==73)causes.push('297-passage source classification missing or inconsistent');
          if(!integration||integration.status!=='STAGING_EVIDENCE_INTEGRATION_NO_LLM'||integration.total!==9||integration.passed!==9)
            causes.push('Integration evidence missing or fewer than 9/9');
          if((integration?.pendingEditorialReview??-1)!==0)
            causes.push('Editorial provenance approval still pending');
          if(!sourceAudit||sourceAudit.status!=='STAGING_SOURCE_TEXT_AUDIT'||sourceAudit.total!==297||
             sourceAudit.badHashes!==0||sourceAudit.sourceFailures.length>0)
            causes.push('Full source audit incomplete or source integrity/fetch failures');
          if(sourceAudit&&['NO_TEXT_MATCH','PARTIAL_TEXT_MATCH','TOO_SHORT_FOR_TEXT_AUDIT','SOURCE_UNAVAILABLE']
              .some(k=>(sourceAudit.stats[k]??0)>0))
            causes.push('Source transcription/boundary discrepancies need editorial resolution');
          const lines=['### Staging diagnostic summary','',
            'Diagnostic steps run independently; editorial release approval is deliberately not treated as a unit-test failure.',
            '', 'Production release readiness: '+(causes.length===0?'ELIGIBLE FOR FURTHER REVIEW':'NOT APPROVED'),
            '',...causes.map(c=>'- '+c),'',
            '**This diagnostic workflow never deploys or promotes production.**'];
          process.stdout.write(lines.join('\\n')+'\\n');
          NODE
      - name: Verify Gregory logical identity and dialogue speakers against staging
        env:
          LIBRARY_STAGING_DB_URL: ${{ secrets.LIBRARY_STAGING_DB_URL }}
          LIBRARY_STAGING_BRANCH_ID: ${{ secrets.LIBRARY_STAGING_BRANCH_ID }}
        run: |
          node scripts/patristics/test-gregory-identity-speakers-staging.mjs > "$RUNNER_TEMP/patristic-gregory-dialogue-staging.json"
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import {readFileSync} from 'node:fs';
          const r=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/patristic-gregory-dialogue-staging.json','utf8'));
          if(r.status!=='GREGORY_LOGICAL_IDENTITY_SPEAKER_STAGING'||r.total!==8||
             r.passed!==8||r.databaseWrites!==0||r.productionChanges!==0||
             r.quoteApprovals!==0)throw Error('Gregory dialogue review not complete: '+r.passed+'/'+r.total);
          process.stdout.write(['### Gregory identity and dialogue review','',
            'Verified '+r.passed+'/'+r.total+' author/voice safety cases.',
            'Original author records retained: '+r.distinctAuthorIds,
            'Exact fingerprinted speaker mappings: '+r.reviewedSpeakers,
            'Unapproved voice/source items kept blocked: '+r.unapprovedSpeakerPassages,
            'No automatic quotation authorization.'].join('\\n')+'\\n');
          NODE
      - name: Save Gregory identity and dialogue report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patristic-gregory-dialogue-staging
          path: ${{ runner.temp }}/patristic-gregory-dialogue-staging.json
          retention-days: 21
          if-no-files-found: warn
      - name: Save complete holdout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patristic-author-catalog-v2-holdout
          path: ${{ runner.temp }}/patristic-author-catalog-v2-holdout.json
          retention-days: 21
          if-no-files-found: warn
