name: Patristic Library Isolated Tests

on:
  push:
    paths:
      - 'src/lib/patristics/library/**'
      - 'scripts/patristics/sql/**'
      - 'scripts/patristics/index-staging.mjs'
      - 'scripts/patristics/evaluate-staging.mjs'
      - 'scripts/patristics/assess-passage-evidence.mjs'
      - 'scripts/patristics/flag-dialogue-boundaries.mjs'
      - 'scripts/patristics/scan-dialogue-staging.mjs'
      - 'scripts/patristics/universal-query.mjs'
      - 'scripts/patristics/catalog-staging.mjs'
      - 'scripts/patristics/research-staging.mjs'
      - 'scripts/patristics/prepare-source-batch.mjs'
      - 'scripts/patristics/stage-source-batch.mjs'
      - 'scripts/patristics/build-first-source-batch.mjs'
      - 'tests/patristic-first-source-batch.test.mjs'
      - 'scripts/patristics/approved-source-staging.mjs'
      - 'tests/patristic-approved-source-staging.test.mjs'
      - '.github/workflows/patristic-staging-ingest.yml'
      - 'tests/patristic-source-batch.test.mjs'
      - 'tests/patristic-research-staging.test.mjs'
      - 'tests/patristic-universal-query.test.mjs'
      - 'tests/patristic-dialogue-staging-scan.test.mjs'
      - 'tests/patristic-dialogue-boundaries.test.mjs'
      - 'tests/patristic-evidence-policy.test.mjs'
      - 'scripts/patristics/prepare-gregory-source.mjs'
      - 'scripts/patristics/plan-gregory-sections.mjs'
      - 'scripts/patristics/stage-gregory-fullwork.mjs'
      - 'tests/patristic-source-preview.test.mjs'
      - 'tests/patristic-section-manifest.test.mjs'
      - 'tests/patristic-fullwork-staging.test.mjs'
      - 'tests/patristic-library-isolation.test.mjs'
      - 'tests/patristic-library-index-cli.test.mjs'
      - 'tests/patristic-library-evaluate.test.mjs'
      - '.github/workflows/patristic-library-isolated-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-library-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/patristic-library-isolation.test.mjs tests/patristic-library-index-cli.test.mjs tests/patristic-library-evaluate.test.mjs tests/patristic-source-preview.test.mjs tests/patristic-section-manifest.test.mjs tests/patristic-fullwork-staging.test.mjs tests/patristic-evidence-policy.test.mjs tests/patristic-dialogue-boundaries.test.mjs tests/patristic-dialogue-staging-scan.test.mjs tests/patristic-universal-query.test.mjs tests/patristic-research-staging.test.mjs tests/patristic-source-batch.test.mjs tests/patristic-first-source-batch.test.mjs tests/patristic-first-batch-audit.test.mjs tests/patristic-approved-source-staging.test.mjs
