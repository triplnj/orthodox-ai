name: Patristic Source Preview QA

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patristics/build-first-source-batch.mjs'
      - 'scripts/patristics/prepare-source-batch.mjs'
      - 'scripts/patristics/audit-first-source-batch.mjs'
      - 'tests/patristic-first-source-batch.test.mjs'
      - 'tests/patristic-first-batch-audit.test.mjs'
      - '.github/workflows/patristic-source-preview-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: patristic-source-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install isolated dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run extraction and audit tests
        run: node --test tests/patristic-first-source-batch.test.mjs tests/patristic-first-batch-audit.test.mjs tests/patristic-source-batch.test.mjs
      - name: Fetch source previews (no DB, no AI API)
        run: node scripts/patristics/build-first-source-batch.mjs "$RUNNER_TEMP/patristic-first-batch.preview.json"
      - name: Validate source structure
        run: node scripts/patristics/prepare-source-batch.mjs "$RUNNER_TEMP/patristic-first-batch.preview.json"
      - name: Audit coverage and write review report
        run: node scripts/patristics/audit-first-source-batch.mjs "$RUNNER_TEMP/patristic-first-batch.preview.json" > "$RUNNER_TEMP/patristic-source-audit.json"
      - name: Publish audit summary
        shell: bash
        run: |
          echo '### Patristic source preview QA (no import)' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Validated two Wikisource edition previews. No Neon database or OpenAI keys were used.' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const report=JSON.parse(readFileSync(process.env.RUNNER_TEMP+"/patristic-source-audit.json","utf8"));
            console.log("### Reviewed content candidate hash");
            console.log("SHA256: "+report.manifestSha256);
            console.log("");
            console.log("**Not yet editorially approved.** Verify the source preview and permissions before importing.");
            console.log("");
            for(const work of report.results){
              console.log("- "+work.author+" — "+work.title+": "+work.paragraphs+" paragraphs, "+work.chunks+" chunks; "+work.status);
            }
          ' >> "$GITHUB_STEP_SUMMARY"
      - name: Archive audit and review-only preview
        uses: actions/upload-artifact@v4
        with:
          name: patristic-source-preview-qa
          path: |
            ${{ runner.temp }}/patristic-source-audit.json
            ${{ runner.temp }}/patristic-first-batch.preview.json
          retention-days: 7
          if-no-files-found: error
